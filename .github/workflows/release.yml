name: Release

# tag 约定：<mod_id>-<mc_version>-<loader>-<mod_version>
# 例：netsourcecasting-1.21.1-neoforge-1.0.2
#
# 版本坐标（MC 版本、加载器、模组版本）的真源是 gradle.properties，
# tag 是照它拼出来再推上去的对外名字。CI 只做一次整串相等对账，不反向切分——
# MC 预发布版本自带连字符（1.21.1-pre1），按段切容易错位。
on:
  push:
    tags:
      - '*-*-*-*'

permissions:
  contents: write

# 同一 tag 只跑一个 release：推错 tag 后删掉重推时，两个 run 会同时去建同一个 Release。
# 不设 cancel-in-progress——发布跑一半被掐断会留下「tag 在、Release 不在」的半截状态。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7.0.1

      # 读 gradle.properties。这里的值既是构建输入，也是给 tag 对账用的期望值。
      - name: Read gradle.properties
        id: props
        shell: bash
        run: |
          set -euo pipefail

          # mod_name 含空格，不能像数字字段那样把空白全删掉，只去掉行尾空白和 \r。
          get() {
            sed -nE "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*//p" gradle.properties | tail -1 | tr -d '\r' | sed -e 's/[[:space:]]*$//'
          }

          mod_id="$(get mod_id)"
          mod_name="$(get mod_name)"
          mc_version="$(get minecraft_version)"
          loader="$(get mod_loader)"
          mod_version="$(get mod_version)"
          java_version="$(get java_version)"
          cf_id="$(get curseforge_project_id)"

          for pair in "mod_id=$mod_id" "mc_version=$mc_version" "loader=$loader" \
                      "mod_version=$mod_version"; do
            if [ -z "${pair#*=}" ]; then
              echo "::error::gradle.properties 缺少 ${pair%%=*}"
              exit 1
            fi
          done
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::缺少 CHANGELOG.md"
            exit 1
          fi

          echo "mod_id=$mod_id" >> "$GITHUB_OUTPUT"
          echo "mod_name=$mod_name" >> "$GITHUB_OUTPUT"
          echo "mc_version=$mc_version" >> "$GITHUB_OUTPUT"
          echo "loader=$loader" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "curseforge_project_id=$cf_id" >> "$GITHUB_OUTPUT"
          echo "java_version=${java_version:-21}" >> "$GITHUB_OUTPUT"

          # 版本类型只分 alpha / beta / release（见工作区 AGENTS.md）。
          # 判错的后果：mc-publish 按 prerelease = version_type != release 填，
          # 预发布会被当正式版发出去并抢占 Latest。
          case "$mod_version" in
            *-alpha*) type=alpha   ;;
            *-beta*)  type=beta    ;;
            *)        type=release ;;
          esac
          echo "version_type=$type" >> "$GITHUB_OUTPUT"
          echo "坐标：mc=$mc_version loader=$loader version=$mod_version ($type) java=${java_version:-21}"

      # 发布标签与版本坐标对账。整串比较同时覆盖段内容、顺序、分隔符，
      # 比逐段断言更强；tag 写错时在这里红，不会带着错的版本发出去。
      - name: Reconcile tag with gradle.properties
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED: ${{ steps.props.outputs.mod_id }}-${{ steps.props.outputs.mc_version }}-${{ steps.props.outputs.loader }}-${{ steps.props.outputs.mod_version }}
        run: |
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::tag '$TAG' 与 gradle.properties 不一致；期望 '$EXPECTED'（先改 properties 再打 tag）"
            exit 1
          fi
          echo "对账通过：$TAG"

      # 发布说明取 CHANGELOG.md 里 ## [<mod_version>] 那一段，GitHub Release 与 CurseForge 共用。
      # 抽不到（或段为空）就失败：宁可不发，也不要发一个没有说明的版本。
      - name: Extract release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.props.outputs.mod_version }}
        run: |
          set -euo pipefail
          mkdir -p build
          notes=build/release-notes.md
          # 段起点是 '## [<version>]'，到下一个 '## [' 结束；段内的 ### 子标题原样保留。
          # 用 index() 而不是正则，版本号里的 '.' 不必转义，'[' 也不必转义。
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found
          ' CHANGELOG.md | sed '/./,$!d' > "$notes"

          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md 缺少 ## [$VERSION] 段或该段为空；先在 CHANGELOG 里写好本次更新再打 tag"
            exit 1
          fi
          echo "发布说明 $(wc -c < "$notes") 字节："
          cat "$notes"

      # JDK 与 build.yml 同源：读 gradle.properties 的 java_version，缺失时回退 21。
      - name: Set up JDK ${{ steps.props.outputs.java_version }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ steps.props.outputs.java_version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 不再传 -Pmod_version：构建用的版本必须就是提交里的 mod_version，
      # 否则会出现「tag 版本能构建、仓里却没有这个版本」的产物。
      - name: Build
        run: ./gradlew build --no-daemon

      # jar 名由 archivesName 拼出，与 tag 同构；这里只确认它真的产出了。
      - name: Verify artifact
        id: artifact
        shell: bash
        env:
          JAR: build/libs/${{ steps.props.outputs.mod_id }}-${{ steps.props.outputs.mc_version }}-${{ steps.props.outputs.loader }}-${{ steps.props.outputs.mod_version }}.jar
        run: |
          if [ ! -f "$JAR" ]; then
            echo "::error::没有产出 $JAR；build/libs 里是："
            ls -l build/libs
            exit 1
          fi
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "产物：$JAR ($(du -h "$JAR" | cut -f1))"

      # 无 curseforge_project_id：只发 GitHub Release（不传任何 curseforge 参数，
      # 否则 mc-publish 会按 slug 去探测 CurseForge 项目、导致失败）。
      - name: "Publish GitHub Release only"
        if: ${{ steps.props.outputs.curseforge_project_id == '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: ${{ steps.artifact.outputs.jar }}
          name: ${{ steps.props.outputs.mod_name }} ${{ steps.props.outputs.mod_version }} for ${{ steps.props.outputs.mc_version }}
          version: ${{ steps.props.outputs.mod_version }}
          version-type: ${{ steps.props.outputs.version_type }}
          loaders: ${{ steps.props.outputs.loader }}
          game-versions: ${{ steps.props.outputs.mc_version }}
          java: ${{ steps.props.outputs.java_version }}
          environment: client | server
          changelog-file: build/release-notes.md
          fail-mode: fail

      # 有 curseforge_project_id：GitHub Release + CurseForge 一起发，两边正文同源。
      - name: "Publish GitHub Release + CurseForge"
        if: ${{ steps.props.outputs.curseforge_project_id != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          curseforge-id: ${{ steps.props.outputs.curseforge_project_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: ${{ steps.artifact.outputs.jar }}
          name: ${{ steps.props.outputs.mod_name }} ${{ steps.props.outputs.mod_version }} for ${{ steps.props.outputs.mc_version }}
          version: ${{ steps.props.outputs.mod_version }}
          version-type: ${{ steps.props.outputs.version_type }}
          loaders: ${{ steps.props.outputs.loader }}
          game-versions: ${{ steps.props.outputs.mc_version }}
          java: ${{ steps.props.outputs.java_version }}
          environment: client | server
          changelog-file: build/release-notes.md
          fail-mode: fail
